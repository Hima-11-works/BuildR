<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — BuildR</title>
    <meta name="description" content="Sign in to BuildR to build and tailor your resume with AI.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Theme init (prevents flash) -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <!-- Firebase: client-side SDK config injected by Flask -->
    <script type="module" id="firebase-init-script">
        const firebaseConfig = {{ firebase_config | tojson }};

        const { initializeApp }    = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const { getAuth, GoogleAuthProvider, signInWithPopup, getIdToken }
                                   = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

        const firebaseApp  = initializeApp(firebaseConfig);
        const auth         = getAuth(firebaseApp);
        const provider     = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        window.__fbAuth     = auth;
        window.__fbProvider = provider;
        window.__getIdToken = getIdToken;

        // If user is already signed in to Firebase, try to restore session.
        auth.onAuthStateChanged(async (user) => {
            if (!user) return;
            const btn = document.getElementById('google-signin-btn');
            if (btn) setButtonLoading(btn, true);
            try {
                const idToken = await getIdToken(user, /* forceRefresh= */ false);
                await exchangeToken(idToken);
            } catch (e) {
                // Token exchange failed — let user click manually.
                if (btn) setButtonLoading(btn, false);
            }
        });

        async function exchangeToken(idToken) {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_token: idToken }),
            });
            if (res.ok) {
                window.location.href = '/';
            } else {
                const data = await res.json().catch(() => ({}));
                showError(data.error || 'Sign-in failed. Please try again.');
                const btn = document.getElementById('google-signin-btn');
                if (btn) setButtonLoading(btn, false);
            }
        }

        window.__signInWithGoogle = async function () {
            const btn = document.getElementById('google-signin-btn');
            setButtonLoading(btn, true);
            hideError();
            try {
                const result   = await signInWithPopup(auth, provider);
                const idToken  = await getIdToken(result.user);
                await exchangeToken(idToken);
            } catch (err) {
                if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                    // User dismissed — silently reset.
                } else {
                    showError('Google sign-in failed: ' + (err.message || err.code));
                }
                setButtonLoading(btn, false);
            }
        };
    </script>

    <style>
        /* ── Design tokens (mirrors style.css) ── */
        :root {
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition-fast: 150ms cubic-bezier(0.4,0,0.2,1);
            --transition-normal: 250ms cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="light"] {
            --bg-base:        #EFE7DC;
            --bg-card:        #F4EEE6;
            --bg-card-hover:  #FAF6F0;
            --text-primary:   #111111;
            --text-secondary: #444444;
            --text-muted:     #7E7467;
            --text-on-accent: #F4EEE6;
            --accent-solid:   #111111;
            --accent-glow:    rgba(17,17,17,0.10);
            --border-subtle:  #DCD1C2;
            --border-accent:  #C8BBAA;
            --error:          #A30000;
            --error-bg:       rgba(163,0,0,0.08);
            --shadow-card:    0 4px 20px rgba(68,62,54,0.06);
            --shadow-elevated:0 8px 40px rgba(68,62,54,0.12);
        }
        [data-theme="dark"] {
            --bg-base:        #121214;
            --bg-card:        #1E1E22;
            --bg-card-hover:  #25252A;
            --text-primary:   #F4EEE6;
            --text-secondary: #A0A0A0;
            --text-muted:     #666666;
            --text-on-accent: #121214;
            --accent-solid:   #F4EEE6;
            --accent-glow:    rgba(244,238,230,0.15);
            --border-subtle:  rgba(244,238,230,0.12);
            --border-accent:  rgba(244,238,230,0.35);
            --error:          #FF4D6D;
            --error-bg:       rgba(255,77,109,0.12);
            --shadow-card:    0 4px 24px rgba(0,0,0,0.5);
            --shadow-elevated:0 8px 48px rgba(0,0,0,0.75);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 250ms, color 250ms;
            position: relative;
            overflow: hidden;
        }

        /* ── Ambient background orbs ── */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 250ms;
        }
        [data-theme="light"] body::before {
            width: 500px; height: 500px;
            top: -120px; right: -100px;
            background: radial-gradient(circle, rgba(200,187,170,0.35) 0%, transparent 70%);
        }
        [data-theme="light"] body::after {
            width: 400px; height: 400px;
            bottom: -100px; left: -80px;
            background: radial-gradient(circle, rgba(220,209,194,0.30) 0%, transparent 70%);
        }
        [data-theme="dark"] body::before {
            width: 600px; height: 600px;
            top: -150px; right: -150px;
            background: radial-gradient(circle, rgba(244,238,230,0.04) 0%, transparent 70%);
        }
        [data-theme="dark"] body::after {
            width: 500px; height: 500px;
            bottom: -150px; left: -100px;
            background: radial-gradient(circle, rgba(244,238,230,0.03) 0%, transparent 70%);
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 100;
            width: 38px; height: 38px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--transition-fast), border-color var(--transition-fast),
                        transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-accent);
            transform: scale(1.05);
            box-shadow: var(--shadow-card);
        }
        .theme-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        [data-theme="light"] .icon-moon { display: block; }
        [data-theme="light"] .icon-sun  { display: none; }
        [data-theme="dark"]  .icon-sun  { display: block; }
        [data-theme="dark"]  .icon-moon { display: none; }

        /* ── Card ── */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-elevated);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: cardIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 36px; height: 36px;
            background: var(--accent-solid);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .logo-icon svg {
            width: 20px; height: 20px;
            stroke: var(--text-on-accent);
            fill: none; stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .logo-name {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        /* ── Heading ── */
        .login-heading {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-sub {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        /* ── Google sign-in button ── */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-fast), border-color var(--transition-fast),
                        box-shadow var(--transition-fast), transform var(--transition-fast);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }
        .btn-google:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-card);
            transform: translateY(-1px);
        }
        .btn-google:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .btn-google:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }
        .btn-google .google-icon {
            width: 20px; height: 20px;
            flex-shrink: 0;
            transition: opacity var(--transition-fast);
        }
        .btn-google .btn-label { transition: opacity var(--transition-fast); }

        /* Loading spinner inside button */
        .btn-google .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid var(--border-subtle);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .btn-google.loading .spinner        { display: block; }
        .btn-google.loading .google-icon    { display: none; }
        .btn-google.loading .btn-label      { opacity: 0.6; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error box ── */
        .error-box {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            background: var(--error-bg);
            border: 1px solid var(--error);
            color: var(--error);
            font-size: 0.8125rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .error-box.visible { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Divider ── */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-subtle);
            margin: 1.75rem 0;
        }

        /* ── Footer note ── */
        .login-footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }
        .login-footer a {
            color: var(--text-secondary);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
    </style>
</head>

<body>
    <!-- Theme toggle -->
    <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme" onclick="toggleTheme()">
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <div class="login-card" role="main">
        <!-- Logo -->
        <div class="logo-wrap" aria-label="BuildR">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <span class="logo-name">BuildR</span>
        </div>

        <!-- Heading -->
        <h1 class="login-heading">Welcome back</h1>
        <p class="login-sub">Sign in to build and tailor your<br>resume with AI assistance.</p>

        <!-- Google Sign-In Button -->
        <button
            id="google-signin-btn"
            class="btn-google"
            type="button"
            aria-label="Sign in with Google"
            onclick="window.__signInWithGoogle && window.__signInWithGoogle()"
        >
            <span class="spinner" aria-hidden="true"></span>
            <!-- Google "G" logo -->
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span class="btn-label">Continue with Google</span>
        </button>

        <!-- Error message -->
        <div id="signin-error" class="error-box" role="alert" aria-live="polite"></div>

        <div class="divider" aria-hidden="true"></div>

        <p class="login-footer">
            By signing in you agree to use this app responsibly.<br>
            Your data is stored securely and only accessible to you.
        </p>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function setButtonLoading(btn, loading) {
            btn.disabled = loading;
            btn.classList.toggle('loading', loading);
        }

        function showError(msg) {
            const el = document.getElementById('signin-error');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function hideError() {
            const el = document.getElementById('signin-error');
            el.classList.remove('visible');
        }
    </script>
</body>

</html>
